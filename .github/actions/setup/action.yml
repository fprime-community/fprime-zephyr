name: 'Zephyr CI Setup'
description: 'Set up Zephyr environment for Zephyr CI'
inputs:
  workspace_directory:
    description: "Path to Zephyr workspace"
    required: true
    type: string
  stage: 
    description: "Stage of the CI process"
    required: false
    default: "all"
    type: string
runs:
  using: "composite"
  steps:
    - name: "Install CI tooling"
      run: |
        CI_TOOLS_PATH="$(cd $(dirname "$GITHUB_ACTION_PATH")/../../ci && pwd)"
        echo "CI Tools Path: $CI_TOOLS_PATH"
        pip install "${CI_TOOLS_PATH}"
      shell: bash
    # Cache the Zephyr SDK and the west-managed repositories so the large
    # downloads performed by "west update" / "west sdk install" only happen
    # when the manifest changes. On a cache hit "west update" is a fast
    # sync and "west sdk install" skips the already-installed SDK.
    #
    # Caches saved from pull_request runs are scoped to that PR's merge ref,
    # invisible to every other PR, and count against the consuming
    # repository's shared 10 GB Actions cache quota — a single ~3 GB save
    # per PR evicts everything else. PR runs therefore restore-only; the
    # cache is saved from default-branch runs (schedule / push / dispatch),
    # which every PR can read via restore-keys.
    - name: "Cache Zephyr SDK and west modules (restore only)"
      if: ${{ (inputs.stage == 'all' || inputs.stage == 'build') && github.event_name == 'pull_request' }}
      uses: actions/cache/restore@v4
      with:
        path: |
          ~/zephyr-sdk-*
          ${{ inputs.workspace_directory }}/zephyr
          ${{ inputs.workspace_directory }}/modules
          ${{ inputs.workspace_directory }}/tools
          ${{ inputs.workspace_directory }}/bootloader
        key: zephyr-workspace-${{ runner.os }}-${{ hashFiles('**/west.yml') }}
        restore-keys: |
          zephyr-workspace-${{ runner.os }}-
    - name: "Cache Zephyr SDK and west modules"
      if: ${{ (inputs.stage == 'all' || inputs.stage == 'build') && github.event_name != 'pull_request' }}
      uses: actions/cache@v4
      with:
        path: |
          ~/zephyr-sdk-*
          ${{ inputs.workspace_directory }}/zephyr
          ${{ inputs.workspace_directory }}/modules
          ${{ inputs.workspace_directory }}/tools
          ${{ inputs.workspace_directory }}/bootloader
        key: zephyr-workspace-${{ runner.os }}-${{ hashFiles('**/west.yml') }}
        restore-keys: |
          zephyr-workspace-${{ runner.os }}-
    - name: "Zephyr Setup"
      if: ${{ inputs.stage == 'all' || inputs.stage == 'build' }}
      run: |
          cd ${{ inputs.workspace_directory }}
          west update
          west sdk install
      shell: bash
